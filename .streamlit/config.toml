[theme]
base = "dark"
primaryColor = "#4C9BE8"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1C2029"
textColor = "#FAFAFA"
font = "sans serif"
headingFontSizes = ["2.25rem", "1.5rem", "1.25rem", "1.125rem", "1rem", "0.875rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "2rem"
baseRadius = "0.5rem"
borderColor = "#2A303C"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#161B24"

[theme.sidebar]
backgroundColor = "#12161E"
secondaryBackgroundColor = "#1C2029"

[server]
headless = true

[browser]
gatherUsageStats = false
