[theme]
base = "dark"
font = "sans serif"
headingFontSizes = ["2.25rem", "1.5rem", "1.25rem", "1.125rem", "1rem", "0.875rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontSize = "2rem"
baseRadius = "0.5rem"
showWidgetBorder = true

[theme.dark]
primaryColor = "#4C9BE8"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1C2029"
textColor = "#FAFAFA"
borderColor = "#2A303C"
dataframeHeaderBackgroundColor = "#161B24"

[theme.dark.sidebar]
backgroundColor = "#12161E"
secondaryBackgroundColor = "#1C2029"

[theme.light]
primaryColor = "#1769AA"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6FA"
textColor = "#182332"
borderColor = "#CFD8E3"
dataframeHeaderBackgroundColor = "#E9EFF6"

[theme.light.sidebar]
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#EBF1F7"

[server]
headless = true

[browser]
gatherUsageStats = false
