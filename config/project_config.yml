# ============================================================
# Clinical Trial Access & Recruitment Competition Intelligence
# Central runtime configuration.
#
# `default_profile: full_catalog` makes this the registry-wide
# configuration (issue #53): a bare `python -m src.cli ingest`
# snapshots the whole ClinicalTrials.gov registry, no indication
# profile required. Condition-scoped ingestion is opt-in via
# `--profile <id>` (config/profiles/*.yml, e.g. adrd) and the
# orchestrated profiles are refreshed by `orchestrate`.
#
# Parameter syntax verified against the live ClinicalTrials.gov
# API v2 (GET /api/v2/studies) on 2026-07-24 and re-verified for
# this file's parameters on 2026-10-30:
#   - fields              : pipe-delimited field projection; branch
#                           names (e.g. protocolSection.statusModule)
#                           include all descendant fields. PascalCase
#                           dotted paths are rejected by the API.
#   - pageSize            : API-coerced maximum 1000 (OpenAPI: "It
#                           will be coerced down to 1,000")
#   - pageToken           : follow nextPageToken until absent
#   - countTotal          : include totalCount on the first page
#   - filter.advanced     : Essie expression; incremental refresh
#                           ANDs in AREA[LastUpdatePostDate]RANGE[<since>,MAX]
#                           (verified live 2026-10-30)
# OpenAPI spec: https://clinicaltrials.gov/api/oas/v2
# ============================================================

project:
  name: cti-dashboard
  description: >-
    Public-registry-based feasibility prioritization for clinical operations.
    Signals only — not a recruitment forecast and not clinical decision support.
  timezone: UTC

# Single source of truth for default registry-wide scope and API parameters.
# config/profiles/full_catalog.yml is authoritative.
default_profile: full_catalog

api:
  base_url: https://clinicaltrials.gov/api/v2
  studies_endpoint: /studies
  openapi_spec_url: https://clinicaltrials.gov/api/oas/v2
  docs_url: https://clinicaltrials.gov/data-api/api
  format: json
  page_size: 1000           # API maximum (OpenAPI-verified, see header)
  count_total: true
  # Slim field projection: exactly the modules silver reads (flatten_studies.py)
  # plus the two results modules that carry participant demographics for the
  # planned results phase (verified against GET /studies/metadata, the Data
  # Structure source, 2026-10-30). ~7.7 KB/study vs ~17.3 KB full-record.
  fields:
    - protocolSection.identificationModule
    - protocolSection.statusModule
    - protocolSection.designModule
    - protocolSection.sponsorCollaboratorsModule
    - protocolSection.conditionsModule
    - protocolSection.armsInterventionsModule
    - protocolSection.eligibilityModule
    - protocolSection.contactsLocationsModule
    - protocolSection.outcomesModule
    - resultsSection.participantFlowModule
    - resultsSection.baselineCharacteristicsModule
    - hasResults
  # No published numeric rate limit exists (no rate-limit response headers;
  # OpenAPI spec and NLM bulletins silent, checked 2026-10-30). ~50
  # requests/minute is the community consensus; 1.2s spacing stays under it,
  # and 429s still retry with backoff (retry_policy.py).
  min_request_interval_seconds: 1.2
  http:
    timeout_seconds: 120    # 1000-study pages take longer to transfer
    max_retries: 5
    backoff_initial_seconds: 1
    backoff_max_seconds: 60
    retry_on_status: [429, 500, 502, 503, 504]

# bronze_* mirror config/profiles/full_catalog.yml (the default profile):
# `ingest` resolves `default` to full_catalog and writes there, while transform
# and the quality readers load this file. tests/test_profiles.py fails if the
# two stop agreeing, and dbt's bronze source in _sources.yml repeats the
# manifests root as a literal.
paths:
  bronze_api_responses: data/bronze/full_catalog/api_responses
  bronze_manifests: data/bronze/full_catalog/manifests
  silver: data/silver
  gold: data/gold
  duckdb: data/warehouse/clinical_trials.duckdb
  quarantine: data/bronze/full_catalog/manifests/quarantine

ingestion:
  mode_default: incremental           # skip re-download when a completed run
  # for the same query hash exists within reuse_window_hours
  reuse_window_hours: 24
  page_file_pattern: "run_id={run_id}/page={page:05d}.json"
  manifest_file_pattern: "manifest_{run_id}.json"

# How many past runs survive `make prune-data` (src/utils/retention.py).
# bronze = raw API pages, the expensive bytes; snapshot = silver + manifest,
# i.e. the warehouse's longitudinal depth. bronze_runs_to_keep may not exceed
# snapshot_runs_to_keep — the prune refuses it, because raw pages left behind by
# a deleted manifest can never be discovered by a later prune.
#
# Registry storage budget (issue #53; measured/estimated 2026-10-30, see
# docs/decisions/0083-ingest-source.md for the source decision):
#   - registry bronze JSON per full run, with the fields projection:
#     MEASURED ~4.7 GB (609,551 studies x ~7.7 KB) — kept for the latest run
#     only (bronze_runs_to_keep: 1); a mid-run instant briefly holds the
#     previous and the new run (~2x) until prune-data reclaims it.
#   - weekly incremental run: ESTIMATED ~70 MB (~9k changed studies/week,
#     measured 9,017 via AREA[LastUpdatePostDate]RANGE over 7 days).
#   - registry silver per snapshot: see docs/decisions/0083-ingest-source.md
#     for the measured figure; snapshot_runs_to_keep: 3 bounds its total.
retention:
  bronze_runs_to_keep: 1
  snapshot_runs_to_keep: 3

guardrails:
  disclaimer: >-
    Public-registry-based planning signals for analytical portfolio
    demonstration only. Not a recruitment forecast, not clinical decision
    support, and not an assessment of site, sponsor, or population quality.
