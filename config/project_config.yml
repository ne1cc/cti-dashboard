# ============================================================
# Clinical Trial Access & Recruitment Competition Intelligence
# Central runtime configuration. All API query parameters live
# here — never hard-coded in Python.
#
# Parameter syntax verified against the live ClinicalTrials.gov
# API v2 (GET /api/v2/studies) on 2026-07-24:
#   - query.cond          : condition query ("Alzheimer Disease")
#   - filter.overallStatus: pipe-separated status enums
#   - filter.advanced     : Essie expression, e.g. AREA[StudyType]INTERVENTIONAL
#   - pageSize / pageToken: pagination (follow nextPageToken until absent)
#   - countTotal          : include totalCount on the first page
# OpenAPI spec: https://clinicaltrials.gov/api/oas/v2
#
# A separate opt-in profile exists for full-registry (all conditions,
# worldwide) bronze ingestion: config/profiles/full_catalog.yml, run via
# `make ingest-full-catalog`. It does not affect this file's scope or
# any silver/gold/dashboard output.
# ============================================================

project:
  name: cti-dashboard
  description: >-
    Public-registry-based feasibility prioritization for clinical operations.
    Signals only — not a recruitment forecast and not clinical decision support.
  timezone: UTC

api:
  base_url: https://clinicaltrials.gov/api/v2
  studies_endpoint: /studies
  openapi_spec_url: https://clinicaltrials.gov/api/oas/v2
  docs_url: https://clinicaltrials.gov/data-api/api
  format: json
  page_size: 100            # API max is 1000; 100 keeps bronze pages reviewable
  count_total: true
  # Query parameters sent verbatim (values below are joined/encoded by the client)
  query_params:
    query.cond: "Alzheimer Disease"
    filter.advanced: "AREA[StudyType]INTERVENTIONAL"
    filter.overallStatus:      # joined with "|" at request time
      - RECRUITING
      - ACTIVE_NOT_RECRUITING
      - NOT_YET_RECRUITING
      - COMPLETED
  http:
    timeout_seconds: 30
    max_retries: 5
    backoff_initial_seconds: 1
    backoff_max_seconds: 60
    retry_on_status: [429, 500, 502, 503, 504]

scope:
  therapeutic_area: "Alzheimer's disease and related dementias"
  geography: "United States"          # analysis scope; all raw records preserved
  study_type: INTERVENTIONAL
  statuses:
    - RECRUITING
    - ACTIVE_NOT_RECRUITING
    - NOT_YET_RECRUITING
    - COMPLETED
  phases:                             # normalized in silver; source may omit phase
    - EARLY_PHASE1
    - PHASE1
    - PHASE2
    - PHASE3
    - PHASE4
  refresh_cadence: weekly
  history_note: >-
    ClinicalTrials.gov returns only the current record per study. Longitudinal
    status history is constructed by this project from repeated weekly snapshots.

# bronze_* mirror config/profiles/adrd.yml: `ingest --profile default` resolves
# to the adrd profile and writes there, while transform and the quality readers
# load this file. tests/test_profiles.py fails if the two stop agreeing, and
# dbt's bronze source in _sources.yml repeats the manifests root as a literal.
paths:
  bronze_api_responses: data/bronze/adrd/api_responses
  bronze_manifests: data/bronze/adrd/manifests
  silver: data/silver
  gold: data/gold
  duckdb: data/warehouse/clinical_trials.duckdb
  quarantine: data/bronze/adrd/manifests/quarantine

ingestion:
  mode_default: incremental           # skip re-download when a completed run
  # for the same query hash exists within reuse_window_hours
  reuse_window_hours: 24
  page_file_pattern: "run_id={run_id}/page={page:05d}.json"
  manifest_file_pattern: "manifest_{run_id}.json"

# How many past runs survive `make prune-data` (src/utils/retention.py).
# bronze = raw API pages, the expensive bytes; snapshot = silver + manifest,
# i.e. the warehouse's longitudinal depth. bronze_runs_to_keep may not exceed
# snapshot_runs_to_keep — the prune refuses it, because raw pages left behind by
# a deleted manifest can never be discovered by a later prune.
#
# The snapshot horizon is 3, not 6. A 2026-09-07 volume measurement (commit
# 78c2050) on the deployed 1 GB Fly volume found a two-profile /app/data at
# 499.7 MB steady state with 3 retained snapshots — 331.9 MB of that is the
# single retained bronze run per profile (78.8 + 253.1), 34.9 MB of silver per
# snapshot, DuckDB 44.6 MB at one snapshot and 63.2 MB at three.
#
# (a) The plan's rule of record is "headroom >= 2.5 keeps 6". (b) It is
# unsatisfiable at 1 GB for *any* horizon: 2.5x demands a steady state <= 400 MB,
# but a single retained snapshot already walks 411.3 MB and a horizon below 1 is
# refused by prune_profile's horizon guard (0 deletes every run it retains, and a
# negative is refused there rather than by runs_to_prune's helper check). (c) The
# criterion actually applied
# is therefore the deepest horizon whose worst refresh instant leaves >100 MB of
# the 1,000 MB ceiling free: 3 (peak 866.5 MB, walked) — that 100 MB floor is a
# chosen threshold (judgment), not a measurement. A two-point fit through the
# walked peaks peak(1)=778.1 and peak(3)=866.5 (44.2 MB/snapshot) puts 6 at
# ~999 MB (ESTIMATE), at or over the ceiling, and the pressure at that instant is
# the fetch/transform writes, not the DuckDB build — make pipeline runs
# prune-data *before* dbt-run, so the transient second bronze run is reclaimed
# before the warehouse is written.
#
# Depth 3 also drops the guaranteed monthly trend series: at the 7-day cadence
# three snapshots span 14 days, which sits inside one calendar month on 197 of
# 365 weekly start dates (measured 2026-09-07), so recruiting_growth_3m goes null
# rather than 0.0 on those weeks. (d) fly volumes extend cti_data --size 2 is the
# user's action that restores (a)'s premise; raise this back to 6 only after
# extending. docs/DEPLOY_FLY.md ("What to expect") carries the full arithmetic.
retention:
  bronze_runs_to_keep: 1
  snapshot_runs_to_keep: 3

guardrails:
  disclaimer: >-
    Public-registry-based planning signals for analytical portfolio
    demonstration only. Not a recruitment forecast, not clinical decision
    support, and not an assessment of site, sponsor, or population quality.
