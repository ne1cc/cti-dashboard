# ============================================================
# Alzheimer's disease and related dementias (ADRD) condition taxonomy.
# Version-controlled, deterministic mapping — no runtime LLM classification.
#
# Matching runs against a cleaned form of the raw condition string:
# lowercased, apostrophes removed, punctuation → spaces, whitespace collapsed
# (e.g. "Alzheimer's Disease" → "alzheimers disease").
#
# Groups are evaluated IN ORDER; first match wins (most specific first).
# mapping_confidence: exact match → high, substring match → medium,
# unmatched fallback → low.
# ============================================================

version: 1

default:
  condition_group: non_dementia_other
  display_name: Other Conditions
  dementia_relevance: false

groups:
  - condition_group: alzheimers_disease
    display_name: Alzheimer's Disease
    dementia_relevance: true
    exact:
      - alzheimer disease
      - alzheimers disease
      - alzheimer dementia
      - alzheimers dementia
    substrings:
      - alzheimer

  - condition_group: mild_cognitive_impairment
    display_name: Mild Cognitive Impairment (MCI)
    dementia_relevance: true
    exact:
      - mci
    substrings:
      - mild cognitive impairment
      - amnestic mild cognitive

  - condition_group: lewy_body_dementia
    display_name: Lewy Body Dementia (LBD)
    dementia_relevance: true
    exact: []
    substrings:
      - lewy

  - condition_group: frontotemporal_dementia
    display_name: Frontotemporal Dementia (FTD)
    dementia_relevance: true
    exact: []
    substrings:
      - frontotemporal
      - primary progressive aphasia
      - pick disease
      - picks disease

  - condition_group: vascular_dementia
    display_name: Vascular Dementia (VaD)
    dementia_relevance: true
    exact: []
    substrings:
      - vascular dementia
      - vascular cognitive

  - condition_group: parkinsons_disease_dementia
    display_name: Parkinson's Disease Dementia (PDD)
    dementia_relevance: true
    exact:
      - pdd
    substrings:
      - parkinson disease dementia
      - parkinsons disease dementia

  # Catch-all for dementia mentions not matched by a specific group above.
  - condition_group: dementia_unspecified
    display_name: Dementia (Unspecified)
    dementia_relevance: true
    exact: []
    substrings:
      - dementia

  # Cognitive symptoms without an explicit dementia diagnosis. Kept separate
  # and conservatively flagged NOT dementia-relevant to avoid over-claiming.
  - condition_group: cognitive_impairment_other
    display_name: Cognitive Symptoms (Non-Dementia)
    dementia_relevance: false
    exact: []
    substrings:
      - cognitive impairment
      - cognitive decline
      - cognitive dysfunction
      - memory disorder
      - memory impairment
      - memory loss
