# ============================================================
# Indication profile: Non-Small Cell Lung Cancer (NSCLC)
#
# Second shipped indication, demonstrating the multi-indication
# extension path described in src/profiles.py: copy adrd.yml, point
# `taxonomy:` at a condition taxonomy YAML, scope query.cond, and
# give the profile its own bronze tree. No Python changes required.
#
# Usage:
#   python -m src.cli ingest --profile oncology_nsclc
#   python -m src.cli orchestrate        (includes this profile)
#
# Runs alongside the adrd profile with its own bronze tree; silver
# rows are stamped with indication_profile_id: oncology_nsclc.
# ============================================================

profile:
  id: oncology_nsclc
  display_name: "Non-Small Cell Lung Cancer (NSCLC)"
  ingest_only: false
  taxonomy: config/condition_taxonomy_nsclc.yml   # path relative to project root
  score_weights: config/score_weights.yml         # path relative to project root

api:
  base_url: https://clinicaltrials.gov/api/v2
  studies_endpoint: /studies
  openapi_spec_url: https://clinicaltrials.gov/api/oas/v2
  docs_url: https://clinicaltrials.gov/data-api/api
  format: json
  page_size: 100            # API max is 1000; 100 keeps bronze pages reviewable
  count_total: true
  query_params:
    query.cond: "Non-Small Cell Lung Cancer"
    filter.advanced: "AREA[StudyType]INTERVENTIONAL"
    filter.overallStatus:
      - RECRUITING
      - ACTIVE_NOT_RECRUITING
      - NOT_YET_RECRUITING
      - COMPLETED
      - TERMINATED
      - WITHDRAWN
      - SUSPENDED
      - ENROLLING_BY_INVITATION
  http:
    timeout_seconds: 30
    max_retries: 5
    backoff_initial_seconds: 1
    backoff_max_seconds: 60
    retry_on_status: [429, 500, 502, 503, 504]

scope:
  therapeutic_area: "Non-small cell lung cancer (thoracic oncology)"
  geography: "United States"          # analysis scope; all raw records preserved
  study_type: INTERVENTIONAL
  statuses:
    - RECRUITING
    - ACTIVE_NOT_RECRUITING
    - NOT_YET_RECRUITING
    - COMPLETED
    - TERMINATED
    - WITHDRAWN
    - SUSPENDED
    - ENROLLING_BY_INVITATION
  phases:
    - EARLY_PHASE1
    - PHASE1
    - PHASE2
    - PHASE3
    - PHASE4
  refresh_cadence: weekly
  history_note: >-
    ClinicalTrials.gov returns only the current record per study. Longitudinal
    status history is constructed by this project from repeated weekly snapshots.

paths:
  bronze_api_responses: data/bronze/oncology_nsclc/api_responses
  bronze_manifests: data/bronze/oncology_nsclc/manifests
  # silver / gold / duckdb resolved from config/shared_paths.yml at runtime
  silver: data/silver
  gold: data/gold
  duckdb: data/warehouse/clinical_trials.duckdb
  quarantine: data/bronze/oncology_nsclc/manifests/quarantine

ingestion:
  mode_default: incremental
  reuse_window_hours: 24
  page_file_pattern: "run_id={run_id}/page={page:05d}.json"
  manifest_file_pattern: "manifest_{run_id}.json"

# Run retention for this profile (make prune-data, src/utils/retention.py).
# Same horizon as every other profile — one knob, no special cases. The depth
# is 3 and not 6 because of the 1 GB volume measurement recorded in
# config/project_config.yml and docs/DEPLOY_FLY.md: this profile's bronze run
# alone is 253.1 MB of that volume (measured 2026-09-07, commit 78c2050).
retention:
  bronze_runs_to_keep: 1
  snapshot_runs_to_keep: 3

guardrails:
  disclaimer: >-
    Public-registry-based planning signals for analytical portfolio
    demonstration only. Not a recruitment forecast, not clinical decision
    support, and not an assessment of site, sponsor, or population quality.
