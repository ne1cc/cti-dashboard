# ============================================================
# Registry-wide profile: all conditions, worldwide.
#
# The default ingestion target since issue #53 — `python -m src.cli
# ingest` with no flags snapshots the whole registry, no indication
# profile required. It is also transformable: `taxonomy: null` maps
# every condition to "uncategorized" (src/transform/normalize_conditions.py
# REGISTRY_TAXONOMY), so registry-wide silver builds with the same
# flatten code the indication profiles use.
#
# orchestrate: false keeps it out of the multi-profile loop and the
# dashboard's scope selector: its weekly refresh runs on its own
# command (below), and dashboard/gold scopes stay indication-level
# until a later issue generalizes the marts (epic #43).
#
# Refresh cadence:
#   full snapshot   python -m src.cli ingest            (reuse window below)
#   weekly refresh  python -m src.cli ingest --incremental-refresh
#                   (only studies with LastUpdatePostDate on/after the
#                   previous successful run; transform upserts by NCT ID)
#   transform       python -m src.cli transform
# ============================================================

profile:
  id: full_catalog
  display_name: "Full Registry (All Conditions, Worldwide)"
  ingest_only: false   # transformable: silver covers the whole registry
  orchestrate: false   # not in `orchestrate`/refreshable(): own cadence, see header
  taxonomy: null       # REGISTRY_TAXONOMY: conditions stay uncategorized

api:
  base_url: https://clinicaltrials.gov/api/v2
  studies_endpoint: /studies
  openapi_spec_url: https://clinicaltrials.gov/api/oas/v2
  docs_url: https://clinicaltrials.gov/data-api/api
  format: json
  page_size: 1000           # API max, spec-verified 2026-10-30
  count_total: true
  # Slim field projection, identical to project_config.yml — silver's upsert
  # assumes every profile's bronze carries the same modules, so this list must
  # not drift between profiles (tests/test_profile_configs.py guards it).
  fields:
    - protocolSection.identificationModule
    - protocolSection.statusModule
    - protocolSection.designModule
    - protocolSection.sponsorCollaboratorsModule
    - protocolSection.conditionsModule
    - protocolSection.armsInterventionsModule
    - protocolSection.eligibilityModule
    - protocolSection.contactsLocationsModule
    - protocolSection.outcomesModule
    - resultsSection.participantFlowModule
    - resultsSection.baselineCharacteristicsModule
    - hasResults
  # Intentionally empty: no query.cond / filter.* — CTG default is "all studies".
  # `ingest --incremental-refresh` ANDs AREA[LastUpdatePostDate]RANGE[...] in
  # at request time (verified live 2026-10-30).
  query_params: {}
  # No published numeric rate limit (checked 2026-10-30); 1.2s ≈ 50 req/min.
  min_request_interval_seconds: 1.2
  http:
    timeout_seconds: 120    # larger pages take longer to transfer
    max_retries: 5
    backoff_initial_seconds: 1
    backoff_max_seconds: 60
    retry_on_status: [429, 500, 502, 503, 504]

scope:
  therapeutic_area: "All conditions (no filter)"
  geography: "Worldwide (no filter)"
  study_type: "ALL (no filter)"
  statuses: []              # empty = no overallStatus filter
  refresh_cadence: weekly   # --incremental-refresh; full snapshots opt-in
  history_note: >-
    ClinicalTrials.gov returns only the current record per study. Longitudinal
    status history is constructed by repeated snapshots; weekly incremental
    refreshes keep the latest snapshot current, full snapshots reset it.

paths:
  bronze_api_responses: data/bronze/full_catalog/api_responses
  bronze_manifests: data/bronze/full_catalog/manifests
  # silver/gold/duckdb are shared across refreshable profiles, resolved
  # from shared_paths.yml at runtime
  silver: data/silver
  gold: data/gold
  duckdb: data/warehouse/clinical_trials.duckdb
  quarantine: data/bronze/full_catalog/manifests/quarantine

ingestion:
  mode_default: incremental
  # Longer than the condition profiles: a full registry snapshot is far more
  # expensive to redo. Incremental refreshes have a different query hash
  # (date-bounded), so they never collide with this window.
  reuse_window_hours: 720
  page_file_pattern: "run_id={run_id}/page={page:05d}.json"
  manifest_file_pattern: "manifest_{run_id}.json"

# Run retention for this profile (make prune-data, src/utils/retention.py).
# Same horizon as every other profile — one knob, no special cases. With the
# fields projection a registry bronze run is ~4.7 GB (MEASURED 2026-10-30),
# so the single retained run below is the dominant term on any laptop; raw
# JSON is kept for the latest run only, by exactly this horizon.
retention:
  bronze_runs_to_keep: 1
  snapshot_runs_to_keep: 3

guardrails:
  disclaimer: >-
    Public-registry-based planning signals for analytical portfolio
    demonstration only. Not a recruitment forecast, not clinical decision
    support, and not an assessment of site, sponsor, or population quality.
