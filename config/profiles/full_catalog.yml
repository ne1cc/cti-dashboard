# ============================================================
# Opt-in full-catalog ingestion profile.
#
# All conditions, worldwide — no condition/status/study-type filter.
# Runs completely alongside the default ADRD/US profile with its own
# bronze tree, so it cannot interfere with the default pipeline,
# dbt marts, or dashboard.
#
# Scope: ingestion (bronze) only — ingest_only: true.
# Silver/gold/dbt/dashboard remain scoped to condition-specific profiles
# until a later, separately planned chunked-loading phase extends
# transform to this volume.
#
# Run with: make ingest-full-catalog
#   or:     python -m src.cli ingest --profile full_catalog
# ============================================================

profile:
  id: full_catalog
  display_name: "Full Registry (All Conditions, Worldwide)"
  ingest_only: true    # transform, dbt, and dashboard are NOT run for this profile
  taxonomy: null       # no condition grouping applicable
  score_weights: null  # not applicable

api:
  base_url: https://clinicaltrials.gov/api/v2
  studies_endpoint: /studies
  openapi_spec_url: https://clinicaltrials.gov/api/oas/v2
  docs_url: https://clinicaltrials.gov/data-api/api
  format: json
  page_size: 1000           # API max — keeps page count near ~600 for ~600k+ studies
  count_total: true
  # Intentionally empty: no query.cond / filter.* — CTG default is "all studies"
  query_params: {}
  http:
    timeout_seconds: 120    # larger pages take longer to transfer
    max_retries: 5
    backoff_initial_seconds: 1
    backoff_max_seconds: 60
    retry_on_status: [429, 500, 502, 503, 504]

scope:
  therapeutic_area: "All conditions (no filter)"
  geography: "Worldwide (no filter)"
  study_type: "ALL (no filter)"
  statuses: []              # empty = no overallStatus filter
  refresh_cadence: monthly  # descriptive only, not enforced by code
  history_note: >-
    Full-registry bronze snapshot. Ingestion (bronze) only as of this
    phase; silver/gold/dbt/dashboard remain scoped to condition-specific
    profiles until a later, separately planned chunked-loading phase
    extends transform to this volume.

paths:
  bronze_api_responses: data/bronze/full_catalog/api_responses
  bronze_manifests: data/bronze/full_catalog/manifests
  # silver/gold/duckdb unused for this profile (ingest_only: true)
  # but required by PathsConfig — resolved from shared_paths.yml at runtime
  silver: data/silver
  gold: data/gold
  duckdb: data/warehouse/clinical_trials.duckdb
  quarantine: data/bronze/full_catalog/manifests/quarantine

ingestion:
  mode_default: incremental
  # Longer than the ADRD profile: a full-catalog run is far more
  # expensive to redo, and this profile's cadence is monthly.
  reuse_window_hours: 720
  page_file_pattern: "run_id={run_id}/page={page:05d}.json"
  manifest_file_pattern: "manifest_{run_id}.json"

# Run retention for this profile (make prune-data, src/utils/retention.py).
# Deliberately the same horizon as the condition profiles: this profile's
# pages are the whole registry, so a single retained bronze run matters here
# more than anywhere else on the volume — and a special case is a knob nobody
# will remember to re-tune.
# bronze_runs_to_keep is decisive for this profile and this profile only: it is
# ingest_only, so it has no silver and no transform, and the bronze horizon is
# the sole thing bounding its raw pages.
retention:
  bronze_runs_to_keep: 1
  snapshot_runs_to_keep: 6

guardrails:
  disclaimer: >-
    Public-registry-based full-catalog snapshot for analytical
    portfolio demonstration only. Bronze (raw) data only in this
    phase — not reflected in any dashboard, dbt mart, or quality
    report until a later phase implements chunked/partitioned
    transform for this volume.
