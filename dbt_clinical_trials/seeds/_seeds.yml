version: 2

seeds:
  - name: state_population
    description: >
      U.S. Census Bureau resident population estimates (Vintage 2024, July 1, 2024)
      for 50 U.S. states, District of Columbia, and Puerto Rico (52 rows). Used to
      compute population-normalized trial listings per 100k residents.
    columns:
      - name: state_code
        description: Two-letter state postal abbreviation (e.g. CA, NY, DC, PR).
        tests:
          - not_null
          - unique
      - name: fips_code
        description: Two-digit FIPS state numeric code as string (e.g. '01', '06').
        tests:
          - not_null
          - unique
      - name: state_name
        description: Full name of the state, federal district, or territory.
        tests:
          - not_null
      - name: population
        description: Resident population estimate as of July 1, 2024 (POPESTIMATE2024).
        tests:
          - not_null
      - name: estimate_date
        description: Reference date for the population estimate (2024-07-01).
        tests:
          - not_null
      - name: vintage
        description: Census estimates vintage (Vintage 2024).
        tests:
          - not_null
      - name: source_url
        description: Official U.S. Census Bureau dataset download URL.
        tests:
          - not_null

  - name: acs_population
    description: >
      Census ACS 5-year population (vintage ACS 2020-2024; tables B01001 sex by
      age and B03002 Hispanic or Latino origin by race) in long form. Built by
      src/ingest/acs_population.py from the table-based summary files. Committed
      subset: all states, DC and Puerto Rico; counties of DE, MD, RI, VT; four
      ZCTAs. Widen the subset by re-running the ingest with more states.
    columns:
      - name: geo_level
        tests:
          - not_null
          - accepted_values:
              values: [state, county, zcta]
      - name: geo_id
        description: State FIPS (2), county FIPS (5) or ZCTA5 code.
        tests: [not_null]
      - name: population
        description: ACS estimate; null when the Census reports it as unavailable.
      - name: margin_of_error
        description: 90% margin of error (root-sum-of-squares for derived bands).
      - name: table_id
        tests:
          - accepted_values:
              values: [B01001, B03002]
      - name: vintage
        tests: [not_null]

  - name: county_access_context
    description: >
      One row per county (Issue #72): Census Gazetteer 2024 centroid, CDC/ATSDR SVI 2022
      overall percentile rank (national, among counties) and the USDA ERS RUCA 2020
      group holding most of the county's residents. Built by
      src/ingest/access_context.py from the three source files. Committed subset: the
      same counties as acs_population (DE, MD, RI, VT); widen both together.
    columns:
      - name: county_fips
        tests: [not_null, unique]
      - name: latitude
        tests: [not_null]
      - name: longitude
        tests: [not_null]
      - name: svi_rpl_themes
        description: SVI overall percentile rank 0-1; empty when SVI did not compute one.
      - name: ruca_group
        tests:
          - accepted_values:
              values: [metropolitan, micropolitan, small_town, rural, not_coded]
      - name: ruca_group_pop_share
        description: Share of county residents in ruca_group; low values mean a mixed county.

  - name: burden_scp_lung_state
    description: >
      NCI/CDC State Cancer Profiles lung and bronchus incidence by state,
      2019-2023, all races, both sexes, all ages, all stages. Pulled by
      src/ingest/burden_extracts.py (scp). Denominator for NSCLC.
    columns:
      - name: state_fips
        tests: [not_null, unique]
      - name: annual_cases
        description: Average annual count of new cases; empty when suppressed.

  - name: burden_places_county
    description: >
      CDC PLACES 2025 release county estimates (crude prevalence, BRFSS 2023) for
      DIABETES and COGNITION, for the states committed in the ACS county subset
      (DE, MD, RI, VT). Pulled by src/ingest/burden_extracts.py (places).
    columns:
      - name: county_fips
        tests: [not_null]
      - name: measure_id
        tests:
          - accepted_values:
              values: [DIABETES, COGNITION]

  - name: condition_burden_map
    description: >
      MeSH descriptor to burden source. denominator_available is true only when a
      confirmed, ingested source supports an estimated-case count for the condition.
    columns:
      - name: mesh_id
        tests: [not_null, unique]
      - name: denominator_available
        tests: [not_null]

  - name: burden_demographic_share
    description: >
      National (US, SEER + NPCR) average annual lung and bronchus cancer cases by sex and
      by Hispanic origin, 2019-2023, from the same State Cancer Profiles report as
      burden_scp_lung_state. The share of cases per group is the burden side of the
      participation-to-prevalence ratio. "Not Hispanic or Latino" is the sum of the four
      non-Hispanic race reports (scp_race_codes). Pulled by src/ingest/burden_extracts.py
      (scp-demographics). Only sources listed here, with denominator_available true in
      condition_burden_map, can produce a ratio.
    columns:
      - name: burden_source_id
        tests: [not_null]
      - name: dimension
        tests:
          - not_null
          - accepted_values:
              values: [sex, ethnicity]
      - name: group_label
        description: Same labels as the participant groups (Female, Male, Hispanic or Latino, Not Hispanic or Latino).
        tests: [not_null]
      - name: annual_cases
        tests: [not_null]
