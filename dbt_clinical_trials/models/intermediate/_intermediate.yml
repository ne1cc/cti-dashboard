version: 2

models:
  - name: int_similarity_candidates
    description: >
      Bounded candidate pairs for mart_trial_similarity: pairs within a
      profile that share at least one (condition group, phase) token whose per-profile
      trial frequency is below var('similarity_max_token_df'), emitted in both
      orientations. Replaces the unbounded pairwise self-join that measured
      28 GB of DuckDB temporary storage at twelve profiles
      (docs/OPERATIONS.md, 2026-10-04). A trial with no surviving shared
      token gets no pairs here, so mart_trial_similarity emits no rows for it.
    columns:
      - name: candidate_pair_key
        description: >
          Surrogate key over indication_profile_id x nct_id_a x nct_id_b;
          orientation-sensitive, so both directions of a pair have keys.
        tests: [not_null, unique]
      - name: indication_profile_id
        description: Profile whose query scope produced the pair.
        tests: [not_null]
      - name: nct_id_a
        description: One side of the pair (alphabetically first of the unordered pair in the second orientation's mirror rows).
        tests: [not_null]
      - name: nct_id_b
        description: The other side of the pair.
        tests: [not_null]

  - name: int_registry_similarity_candidates
    description: >
      Bounded candidate pairs for mart_registry_trial_similarity: pairs within a
      preset that share at least one (condition group, phase) token whose per-preset
      trial frequency is below var('similarity_max_token_df'), emitted in both
      orientations over canonical registry observations.
    columns:
      - name: candidate_pair_key
        description: Surrogate key over preset_id x nct_id_a x nct_id_b.
        tests: [not_null, unique]
      - name: preset_id
        description: Preset scope whose trial membership produced the pair.
        tests: [not_null]
      - name: nct_id_a
        description: First side of the pair.
        tests: [not_null]
      - name: nct_id_b
        description: Second side of the pair.
        tests: [not_null]

  - name: int_registry_trusted_change_runs
    description: >
      Run-trust gate for canonical registry Change Radar: authoritative complete
      whole-registry runs (status = 'success', whole-registry profile, no condition
      filter) that were newly fetched, ordered by started_at_utc UTC.
    columns:
      - name: ingestion_run_id
        description: Trusted canonical registry ingestion run identifier.
        tests: [not_null, unique]
      - name: observed_at_utc
        description: Run start timestamp (UTC version clock).
        tests: [not_null]
      - name: previous_ingestion_run_id
        description: Prior trusted whole-registry ingestion run identifier, if any.
      - name: previous_observed_at_utc
        description: Version clock timestamp of the prior trusted run.

  - name: int_registry_trial_outcome_sets
    description: >
      Canonical registry grain primary + secondary outcome set hash and summary
      per snapshot_id x nct_id.
    columns:
      - name: registry_trial_key
        tests: [not_null]
      - name: snapshot_id
        tests: [not_null]
      - name: ingestion_run_id
        tests: [not_null]
      - name: nct_id
        tests: [not_null]
      - name: outcome_count
        tests: [not_null]
      - name: outcome_set_hash
        tests: [not_null]
      - name: outcome_summary
        tests: [not_null]

  - name: int_registry_trial_outcome_changes
    description: >
      Consecutive trusted whole-registry run pairs where a trial's outcome set hash
      changed.
    columns:
      - name: registry_trial_key
        tests: [not_null]
      - name: nct_id
        tests: [not_null]
      - name: previous_ingestion_run_id
        tests: [not_null]
      - name: ingestion_run_id
        tests: [not_null]
      - name: before_outcome_set_hash
        tests: [not_null]
      - name: after_outcome_set_hash
        tests: [not_null]

