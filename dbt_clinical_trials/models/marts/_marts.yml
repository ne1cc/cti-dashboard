version: 2

models:
  - name: dim_trial
    description: One row per profile per NCT ID (current record from that profile's latest snapshot).
    contract:
      enforced: true
    columns:
      - name: trial_key
        data_type: VARCHAR
        tests: [not_null, unique]
      - name: nct_id
        data_type: VARCHAR
        # Not unique: the same registry record appears once per indication
        # profile that lists it. The grain is (indication_profile_id, nct_id),
        # guarded by unique_dim_trial_trial_key declared above and by
        # tests/test_dbt_fixture_build.py::test_dim_trial_grain_is_trial_x_profile.
        tests: [not_null]
      - name: indication_profile_id
        data_type: VARCHAR
        description: Indication profile whose query scope produced this row. Part of the model's grain.
        tests: [not_null]
      - name: registry_url
        data_type: VARCHAR
        description: Public ClinicalTrials.gov record URL derived from the NCT ID.
        tests: [not_null]
      - name: current_overall_status
        data_type: VARCHAR
        tests: [not_null]
      - name: current_brief_title
        data_type: VARCHAR
      - name: current_phase
        data_type: VARCHAR
      - name: current_study_type
        data_type: VARCHAR
      - name: current_lead_sponsor
        data_type: VARCHAR
      - name: current_lead_sponsor_normalized
        data_type: VARCHAR
      - name: start_date
        data_type: DATE
      - name: primary_completion_date
        data_type: DATE
      - name: completion_date
        data_type: DATE
      - name: study_first_post_date
        data_type: DATE
      - name: enrollment_count
        data_type: INTEGER
      - name: enrollment_type
        data_type: VARCHAR
      - name: current_has_results_flag
        data_type: BOOLEAN
      - name: record_quality_flag
        data_type: VARCHAR
      - name: first_seen_snapshot_date
        data_type: DATE
      - name: latest_seen_snapshot_date
        data_type: DATE
      - name: active_in_latest_snapshot_flag
        data_type: BOOLEAN
      - name: minimum_age_raw
        data_type: VARCHAR
        description: Preserved verbatim ClinicalTrials.gov minimum age string.
      - name: maximum_age_raw
        data_type: VARCHAR
        description: Preserved verbatim ClinicalTrials.gov maximum age string.
      - name: min_age_years
        data_type: DOUBLE
        description: Minimum eligibility age in fractional years; null if unstated/unbounded/malformed.
      - name: max_age_years
        data_type: DOUBLE
        description: Maximum eligibility age in fractional years; null if unstated/unbounded/malformed.
      - name: std_age_groups
        data_type: VARCHAR[]
        description: Standard age groups (CHILD, ADULT, OLDER_ADULT) applicable to this trial.
      - name: sex_eligibility
        data_type: VARCHAR
        description: Sex eligibility restriction (ALL, FEMALE, MALE, or null/unknown).
      - name: gender_based
        data_type: BOOLEAN
        description: Whether eligibility is based on gender/sex criteria.
      - name: gender_description
        data_type: VARCHAR
        description: Registry description explaining gender-based eligibility.
      - name: accepts_healthy_volunteers
        data_type: BOOLEAN
        description: Whether healthy volunteers are accepted (true, false, or null if unstated).
      - name: age_bounds_valid_flag
        data_type: BOOLEAN
        description: True when age bounds are not contradictory and non-null bounds parsed without error.
      - name: age_bounds_contradictory_flag
        data_type: BOOLEAN
        description: True when both bounds are present and minimum age exceeds maximum age.
      - name: has_unspecified_min_age
        data_type: BOOLEAN
        description: True when minimum age limit is not stated or unbounded.
      - name: has_unspecified_max_age
        data_type: BOOLEAN
        description: True when maximum age limit is not stated or unbounded.
      - name: healthy_volunteers_unknown_flag
        data_type: BOOLEAN
        description: True when healthy volunteer status is unstated or missing.
      - name: sex_eligibility_unknown_flag
        data_type: BOOLEAN
        description: True when sex eligibility is unstated, empty, or unknown.

  - name: dim_condition
    description: >
      Condition node per indication profile (Issue #52). A node is a taxonomy
      condition_group (node_id "group:<slug>", the overlay/fallback text
      mapping) or a registry MeSH browse identity (node_id = mesh id), from
      each trial's current record in that profile. MeSH nodes include the
      registry-supplied ancestor closure, so any tree node is selectable with
      no per-disease configuration. Grain: profile x node_id; counts cover one
      profile's listings and the key hashes both columns.
    contract:
      enforced: true
    columns:
      - name: condition_key
        data_type: VARCHAR
        tests: [not_null, unique]
      - name: indication_profile_id
        data_type: VARCHAR
        description: Indication profile whose query scope produced this row. Part of the model's grain.
        tests: [not_null]
      - name: node_id
        data_type: VARCHAR
        description: >
          Namespaced node identity: "group:<slug>" for taxonomy groups, the
          bare mesh id for MeSH nodes; the two cannot collide.
        tests: [not_null]
      - name: condition_normalized
        data_type: VARCHAR
        description: Node label (taxonomy group slug or MeSH term).
      - name: condition_display_name
        data_type: VARCHAR
        description: >
          Display exemplar: the profile's lexicographically smallest raw
          condition text behind the node, or the MeSH term when the node has
          no text rows.
      - name: condition_group
        data_type: VARCHAR
        description: Legacy alias of condition_normalized kept for existing consumers.
      - name: mesh_id
        data_type: VARCHAR
        description: MeSH browse id for mesh nodes, null for taxonomy group nodes.
      - name: is_ancestor
        data_type: BOOLEAN
        description: >
          True when every membership edge of this MeSH node is an
          ancestor-closure edge (never directly applied in this profile).
          False for taxonomy group nodes and nodes applied directly at least
          once.
      - name: mapping_source
        data_type: VARCHAR
        description: >
          mesh for registry MeSH nodes; yaml_overlay when any condition text
          behind a group node matched a taxonomy rule; text_fallback otherwise.
        tests:
          - accepted_values:
              values: [mesh, yaml_overlay, text_fallback]
      - name: dementia_relevance_flag
        data_type: BOOLEAN
      - name: mapping_confidence
        data_type: VARCHAR
      - name: trial_count
        data_type: BIGINT

  - name: dim_sponsor
    description: >
      Normalized sponsor per indication profile. Grain: profile x
      sponsor_normalized. A sponsor listed by two indications is one
      organization with one row per query scope, each carrying that scope's
      counts; sponsor_key hashes both columns and matches bridge_trial_sponsor.
    contract:
      enforced: true
    columns:
      - name: sponsor_key
        data_type: VARCHAR
        tests: [not_null, unique]
      - name: indication_profile_id
        data_type: VARCHAR
        description: Indication profile whose query scope produced this row. Part of the model's grain.
        tests: [not_null]
      - name: sponsor_normalized
        data_type: VARCHAR
      - name: sponsor_display_name
        data_type: VARCHAR
      - name: sponsor_class
        data_type: VARCHAR
      - name: trial_count
        data_type: BIGINT
      - name: lead_sponsor_trial_count
        data_type: BIGINT

  - name: dim_geography
    description: >
      U.S. state per indication profile. Grain: profile x state_code, so a
      state with trials under both query scopes is two rows with two
      trial_count / listed_site_count figures.
    contract:
      enforced: true
    columns:
      - name: geography_key
        data_type: VARCHAR
        tests: [not_null, unique]
      - name: indication_profile_id
        data_type: VARCHAR
        description: Indication profile whose query scope produced this row. Part of the model's grain.
        tests: [not_null]
      - name: state_code
        data_type: VARCHAR
        # Not unique: the grain is (indication_profile_id, state_code), so e.g.
        # TX appears once per profile that lists Texas sites. geography_key's
        # unique test above hashes both columns and so enforces the grain.
        tests: [not_null]
      - name: geo_level
        data_type: VARCHAR
      - name: country
        data_type: VARCHAR
      - name: county_fips
        data_type: VARCHAR
      - name: metro_area
        data_type: VARCHAR
      - name: trial_count
        data_type: BIGINT
      - name: listed_site_count
        data_type: BIGINT

  - name: dim_date
    contract:
      enforced: true
    columns:
      - name: date_day
        data_type: DATE
        tests: [not_null, unique]
      - name: year
        data_type: BIGINT
      - name: month
        data_type: BIGINT
      - name: quarter
        data_type: BIGINT
      - name: month_start_date
        data_type: DATE
      - name: quarter_start_date
        data_type: DATE
      - name: year_month
        data_type: VARCHAR
      - name: day_name
        data_type: VARCHAR
      - name: is_weekend
        data_type: BOOLEAN

  - name: fct_trial_snapshot
    description: One row per profile per NCT ID per complete snapshot date.
    contract:
      enforced: true
    columns:
      - name: snapshot_key
        data_type: VARCHAR
        tests: [not_null, unique]
      - name: trial_key
        data_type: VARCHAR
        tests:
          - not_null
          - relationships:
              to: ref('dim_trial')
              field: trial_key
      - name: nct_id
        data_type: VARCHAR
        tests: [not_null]
      - name: indication_profile_id
        data_type: VARCHAR
        description: Indication profile whose query scope produced this row. Part of the model's grain.
        tests: [not_null]
      - name: snapshot_date
        data_type: DATE
        tests: [not_null]
      - name: ingestion_run_id
        data_type: VARCHAR
      - name: snapshot_timestamp_utc
        data_type: TIMESTAMP
      - name: overall_status
        data_type: VARCHAR
      - name: previous_status
        data_type: VARCHAR
      - name: status_changed_from_previous_snapshot_flag
        data_type: BOOLEAN
      - name: entered_recruiting_flag
        data_type: BOOLEAN
      - name: left_recruiting_flag
        data_type: BOOLEAN
      - name: phase_normalized
        data_type: VARCHAR
      - name: study_type
        data_type: VARCHAR
      - name: enrollment_count
        data_type: INTEGER
      - name: lead_sponsor_name
        data_type: VARCHAR
      - name: lead_sponsor_normalized
        data_type: VARCHAR
      - name: has_results_flag
        data_type: BOOLEAN
      - name: study_first_post_date
        data_type: DATE
      - name: record_quality_flag
        data_type: VARCHAR
      - name: first_seen_snapshot_date
        data_type: DATE
      - name: days_since_first_seen
        data_type: BIGINT
      - name: condition_group_count
        data_type: BIGINT
      - name: site_count_us
        data_type: BIGINT
      - name: record_hash
        data_type: VARCHAR
      - name: current_record_flag
        data_type: BOOLEAN

  - name: fct_trial_site
    description: One row per profile per trial per U.S. facility per snapshot date.
    contract:
      enforced: true
    columns:
      - name: trial_site_key
        data_type: VARCHAR
        tests: [not_null, unique]
      - name: trial_key
        data_type: VARCHAR
        tests:
          - not_null
          - relationships:
              to: ref('dim_trial')
              field: trial_key
      - name: state_normalized
        data_type: VARCHAR
        tests: [not_null]
      - name: site_key
        data_type: VARCHAR
      - name: nct_id
        data_type: VARCHAR
      - name: indication_profile_id
        data_type: VARCHAR
        description: Indication profile whose query scope produced this row. Part of the model's grain.
        tests: [not_null]
      - name: ingestion_run_id
        data_type: VARCHAR
      - name: snapshot_date
        data_type: DATE
      - name: facility_name
        data_type: VARCHAR
      - name: facility_normalized
        data_type: VARCHAR
      - name: city
        data_type: VARCHAR
      - name: city_normalized
        data_type: VARCHAR
      - name: zip_code
        data_type: VARCHAR
      - name: location_status
        data_type: VARCHAR
      - name: trial_overall_status
        data_type: VARCHAR
      - name: phase_normalized
        data_type: VARCHAR
      - name: lead_sponsor_normalized
        data_type: VARCHAR

  - name: bridge_trial_condition
    description: >
      One row per profile per trial per condition node (Issue #52 grain): a
      taxonomy condition_group (node_id "group:<slug>", how every existing
      group-based view consumes the bridge) or a registry MeSH browse identity
      (node_id = mesh id). MeSH rows carry the registry's ancestor closure
      (is_ancestor), so any tree node is selectable; count metrics and
      similarity keep their pre-MeSH semantics by filtering is_ancestor =
      false (similarity further excludes direct mesh rows).
    contract:
      enforced: true
    columns:
      - name: trial_condition_key
        data_type: VARCHAR
        tests: [not_null, unique]
      - name: trial_key
        data_type: VARCHAR
        tests:
          - not_null
          - relationships:
              to: ref('dim_trial')
              field: trial_key
      - name: condition_key
        data_type: VARCHAR
        description: Same two inputs as dim_condition.condition_key (node_id x indication_profile_id).
        tests:
          - not_null
          - relationships:
              to: ref('dim_condition')
              field: condition_key
      - name: nct_id
        data_type: VARCHAR
      - name: indication_profile_id
        data_type: VARCHAR
        description: Indication profile whose query scope produced this row. Part of the model's grain.
        tests: [not_null]
      - name: node_id
        data_type: VARCHAR
        description: Namespaced node identity ("group:<slug>" or mesh id); part of the model's grain.
        tests: [not_null]
      - name: condition_group
        data_type: VARCHAR
        description: >
          Node label (taxonomy group slug or MeSH term); legacy column name
          kept for existing consumers, which filter on group slugs that MeSH
          term labels never collide with.
        tests: [not_null]
      - name: mesh_id
        data_type: VARCHAR
        description: MeSH browse id for mesh rows, null for taxonomy group rows.
      - name: is_ancestor
        data_type: BOOLEAN
        description: >
          True for registry ancestor-closure edges (browsing only); false for
          taxonomy group rows and directly applied MeSH terms.
        tests: [not_null]
      - name: mapping_source
        data_type: VARCHAR
        description: mesh | yaml_overlay | text_fallback (Issue #52).
        tests:
          - accepted_values:
              values: [mesh, yaml_overlay, text_fallback]
      - name: dementia_relevance_flag
        data_type: BOOLEAN
      - name: mapping_confidence
        data_type: VARCHAR
      - name: source_condition_count
        data_type: BIGINT

  - name: bridge_trial_sponsor
    description: One row per profile per trial per sponsor/collaborator role.
    contract:
      enforced: true
    columns:
      - name: trial_sponsor_key
        data_type: VARCHAR
        tests: [not_null, unique]
      - name: trial_key
        data_type: VARCHAR
        tests:
          - not_null
          - relationships:
              to: ref('dim_trial')
              field: trial_key
      - name: sponsor_key
        data_type: VARCHAR
        description: >
          Same two inputs as dim_sponsor.sponsor_key (sponsor_normalized x
          indication_profile_id); re-hashing one side without the other orphans
          this join.
        tests:
          - not_null
          - relationships:
              to: ref('dim_sponsor')
              field: sponsor_key
      - name: nct_id
        data_type: VARCHAR
      - name: indication_profile_id
        data_type: VARCHAR
        description: Indication profile whose query scope produced this row. Part of the model's grain.
        tests: [not_null]
      - name: sponsor_name
        data_type: VARCHAR
      - name: sponsor_normalized
        data_type: VARCHAR
      - name: sponsor_role
        data_type: VARCHAR
      - name: sponsor_class
        data_type: VARCHAR
      - name: lead_sponsor_flag
        data_type: BOOLEAN

  - name: mart_trial_activity
    description: >
      Segment activity per snapshot, per indication profile. Grain: profile x
      snapshot_date x condition_group x state x phase x overall_status. Counts
      are registry listings, not patient availability.
    contract:
      enforced: true
    columns:
      - name: indication_profile_id
        data_type: VARCHAR
        description: Indication profile whose query scope produced this segment. Part of the model's grain.
        tests: [not_null]
      - name: trial_count
        data_type: BIGINT
        tests: [not_null]
      - name: snapshot_date
        data_type: DATE
      - name: condition_group
        data_type: VARCHAR
      - name: state_normalized
        data_type: VARCHAR
      - name: phase_normalized
        data_type: VARCHAR
      - name: overall_status
        data_type: VARCHAR
      - name: sponsor_count
        data_type: BIGINT
      - name: listed_site_count
        data_type: HUGEINT
      - name: entered_recruiting_count
        data_type: BIGINT
      - name: left_recruiting_count
        data_type: BIGINT
      - name: dementia_relevant_trial_count
        data_type: BIGINT
      - name: flagged_record_count
        data_type: BIGINT

  - name: mart_recruiting_competition
    description: >
      Potential competition signal per recruiting segment, per indication
      profile. Grain: profile x snapshot_date x condition_group x state x
      phase; density_percentile and competition_signal_band rank a segment
      against the other segments of the same profile only. Not a
      recruitment forecast.
    contract:
      enforced: true
    columns:
      - name: indication_profile_id
        data_type: VARCHAR
        description: Indication profile whose query scope produced this segment. Part of the model's grain.
        tests: [not_null]
      - name: recruiting_trial_count
        data_type: BIGINT
        tests: [not_null]
      - name: competition_signal_band
        data_type: VARCHAR
        tests:
          - not_null
          - accepted_values:
              values: ['low', 'moderate', 'elevated']
      - name: snapshot_date
        data_type: DATE
      - name: condition_group
        data_type: VARCHAR
      - name: state_normalized
        data_type: VARCHAR
      - name: phase_normalized
        data_type: VARCHAR
      - name: listed_site_count
        data_type: HUGEINT
      - name: entered_recruiting_count
        data_type: BIGINT
      - name: observed_history_days
        data_type: BIGINT
        description: >
          Days of snapshot history observed as of this snapshot: the span from
          the profile's earliest retained snapshot up to this row's own date.
          Carried beside every windowed figure so "not enough history" is
          quantifiable; 0 on a first snapshot.
      - name: newly_registered_90d
        data_type: BIGINT
        description: >
          Recruiting listings whose registry study_first_post_date falls
          within 90 days of the snapshot (inclusive lower bound, no upper
          bound). A registration count computed from registry dates, not a
          recruiting transition; it needs no snapshot history.
      - name: new_recruiting_30d
        data_type: HUGEINT
        description: >
          Sum of entered_recruiting transitions observed at snapshots inside
          the trailing 30-day window; null unless observed_history_days >= 30
          and the latest gap between snapshots is at most 30 days. Null means
          not enough history, not zero transitions.
      - name: new_recruiting_90d
        data_type: HUGEINT
        description: >
          Sum of entered_recruiting transitions observed at snapshots inside
          the trailing 90-day window; null unless observed_history_days >= 90
          and the latest gap between snapshots is at most 90 days. Null means
          not enough history, not zero transitions.
      - name: recruiting_count_90d_baseline
        data_type: BIGINT
        description: Earliest recruiting count among snapshots inside the trailing 90-day window.
      - name: recruiting_growth_90d
        data_type: DOUBLE
        description: >
          (recruiting count − 90d baseline) / baseline; null unless the 90-day
          window is covered (same guards as new_recruiting_90d, which
          guarantees the baseline is an earlier snapshot) or the baseline is 0.
      - name: sponsor_count
        data_type: BIGINT
      - name: top_sponsor_share
        data_type: DOUBLE
      - name: sponsor_hhi
        data_type: DOUBLE
      - name: density_percentile
        data_type: DOUBLE

  - name: mart_site_overlap
    description: >
      Facility-level trial overlap per snapshot, per indication profile.
      Grain: profile x snapshot_date x facility (normalized name + city +
      state). repeated_site_participation_flag means more than one recruiting
      trial within that profile's listings; a facility shared between two
      profiles' trial sets is not overlap within either query scope.
    contract:
      enforced: true
    columns:
      - name: indication_profile_id
        data_type: VARCHAR
        description: Indication profile whose query scope produced this facility listing. Part of the model's grain.
        tests: [not_null]
      - name: facility_normalized
        data_type: VARCHAR
        tests: [not_null]
      - name: listed_trial_count
        data_type: BIGINT
        tests: [not_null]
      - name: snapshot_date
        data_type: DATE
      - name: city_normalized
        data_type: VARCHAR
      - name: state_normalized
        data_type: VARCHAR
      - name: facility_name
        data_type: VARCHAR
      - name: city
        data_type: VARCHAR
      - name: recruiting_trial_count
        data_type: BIGINT
      - name: sponsor_count
        data_type: BIGINT
      - name: phase_mix
        data_type: VARCHAR
      - name: repeated_site_participation_flag
        data_type: BOOLEAN

  - name: mart_condition_geography_trends
    description: >
      Monthly condition x geography trend, per indication profile. Grain:
      profile x month x condition_group x state. The 3-month rolling average
      and baseline are computed within one profile's series only.
    contract:
      enforced: true
    columns:
      - name: indication_profile_id
        data_type: VARCHAR
        description: Indication profile whose query scope produced this segment. Part of the model's grain.
        tests: [not_null]
      - name: activity_month
        data_type: TIMESTAMP
        tests: [not_null]
      - name: condition_group
        data_type: VARCHAR
        tests: [not_null]
      - name: state_normalized
        data_type: VARCHAR
      - name: trial_count
        data_type: BIGINT
      - name: recruiting_trial_count
        data_type: BIGINT
      - name: newly_registered_in_month
        data_type: BIGINT
        description: >
          Trials whose registry study_first_post_date falls in the snapshot
          month. A registration count, not a recruiting transition.
      - name: sponsor_count
        data_type: BIGINT
      - name: recruiting_trial_count_3m_avg
        data_type: DOUBLE
      - name: recruiting_count_3m_baseline
        data_type: BIGINT
      - name: observed_history_days
        data_type: BIGINT
        description: >
          Days of snapshot history observed as of this month row (earliest
          snapshot through the latest snapshot in or before the month);
          travels with recruiting_growth_3m so "not enough history" is
          quantifiable.
      - name: recruiting_growth_3m
        data_type: DOUBLE
        description: >
          (current monthly recruiting count − earliest count in the trailing
          3-calendar-month window) / baseline; null unless the window's
          earliest observed month is at least 3 months back, so the figure
          never labels a shorter history as 3-month growth. Null means not
          enough history, not zero change.
      - name: population
        data_type: BIGINT
        description: Resident population estimate from U.S. Census Bureau (Vintage 2024, July 1, 2024). Null for unmatched territories.
      - name: population_source
        data_type: VARCHAR
        description: Denominator source agency (U.S. Census Bureau). Null when population is missing.
      - name: population_vintage
        data_type: VARCHAR
        description: Denominator vintage release (Vintage 2024). Null when population is missing.
      - name: recruiting_trials_per_100k
        data_type: DOUBLE
        description: Monthly recruiting trial listings per 100,000 state residents. Null when population is missing or nonpositive.

  - name: mart_data_reliability
    description: >
      One row per ingestion run with reconciliation shares; each run belongs to
      exactly one indication profile. Grain: ingestion_run_id x
      indication_profile_id — the run alone is already unique, because a run
      never spans profiles, so ingestion_run_id keeps its unique test. The
      profile is taken from silver when silver exists and from the manifest
      otherwise, since a manifest written before profile stamping defaults its
      profile field.
    contract:
      enforced: true
    columns:
      - name: ingestion_run_id
        data_type: VARCHAR
        tests: [not_null, unique]
      - name: indication_profile_id
        data_type: VARCHAR
        description: Indication profile this run refreshed. Part of the model's grain.
        tests: [not_null]
      - name: snapshot_date
        data_type: DATE
      - name: started_at_utc
        data_type: TIMESTAMP
      - name: condition
        data_type: VARCHAR
      - name: mode
        data_type: VARCHAR
      - name: status
        data_type: VARCHAR
      - name: page_count
        data_type: INTEGER
      - name: manifest_record_count
        data_type: INTEGER
      - name: total_count_reported
        data_type: INTEGER
      - name: quarantined_record_count
        data_type: INTEGER
      - name: trial_row_count
        data_type: BIGINT
      - name: distinct_trial_count
        data_type: BIGINT
      - name: manifest_reconciled_flag
        data_type: BOOLEAN
      - name: unique_nct_flag
        data_type: BOOLEAN
      - name: flagged_record_count
        data_type: BIGINT
      - name: flagged_record_share
        data_type: DOUBLE
      - name: missing_enrollment_share
        data_type: DOUBLE
      - name: missing_start_date_share
        data_type: DOUBLE
      - name: missing_lead_sponsor_share
        data_type: DOUBLE
      - name: location_row_count
        data_type: BIGINT
      - name: usable_location_count
        data_type: BIGINT
      - name: usable_location_share
        data_type: DOUBLE
      - name: coordinates_exact_count
        data_type: BIGINT
        description: >
          Site rows carrying registry geoPoint latitude and longitude (exact
          coordinates, Issue #63 coordinate coverage).
      - name: coordinates_fallback_eligible_count
        data_type: BIGINT
        description: >
          Site rows without geoPoint that carry the fields the offline
          Gazetteer fallback needs (a ZIP, or a normalized city+state).
          Fallback-eligible rather than verified against the Gazetteer, whose
          reference files are outside the dbt build (Issue #63).
      - name: coordinates_exact_share
        data_type: DOUBLE
        description: coordinates_exact_count / location_row_count.
      - name: coordinates_fallback_eligible_share
        data_type: DOUBLE
        description: coordinates_fallback_eligible_count / location_row_count.
      - name: condition_row_count
        data_type: BIGINT
      - name: low_confidence_condition_count
        data_type: BIGINT
      - name: low_confidence_condition_share
        data_type: DOUBLE
      - name: error
        data_type: VARCHAR

  - name: mart_feasibility_priority_queue
    description: >
      Segments for human feasibility review, one listing per indication
      profile. Grain: profile x condition_group x state x phase at that
      profile's latest complete snapshot. Triage signal from public registry
      listings with transparent raw sortable metrics; not a recruitment
      forecast.
    contract:
      enforced: true
    columns:
      - name: priority_queue_key
        data_type: VARCHAR
        description: >
          Surrogate key over indication_profile_id x condition_group x
          state_normalized x phase_normalized x snapshot_date, so the same
          segment label under two profiles is two queue entries.
        tests: [not_null, unique]
      - name: snapshot_date
        data_type: DATE
        description: Date of the underlying trial snapshot.
      - name: latest_snapshot_date
        data_type: DATE
        description: Standardized alias of snapshot_date for readability across UI consumers.
      - name: indication_profile_id
        data_type: VARCHAR
        description: Indication profile whose query scope produced this segment. Part of the model's grain.
        tests: [not_null]
      - name: condition_group
        data_type: VARCHAR
        description: Clinical condition / indication taxonomy group.
      - name: state_normalized
        data_type: VARCHAR
        description: Two-letter abbreviation of US state or jurisdiction.
      - name: phase_normalized
        data_type: VARCHAR
        description: Clinical trial phase (e.g. PHASE1, PHASE2, PHASE3).
      - name: recruiting_trial_count
        data_type: BIGINT
        description: Raw count of actively recruiting interventional trials within the segment.
      - name: active_recruiting_trials
        data_type: BIGINT
        description: Standardized alias of recruiting_trial_count for clarity in downstream consumers.
      - name: listed_site_count
        data_type: HUGEINT
        description: Count of attributable clinical trial facility listings in this state for this segment.
      - name: new_recruiting_90d
        data_type: HUGEINT
        description: >
          Count of trials observed transitioning into recruiting status within
          the last 90 days; null unless the profile's retained snapshots cover
          the 90-day window (see mart_recruiting_competition). Null means not
          enough history, not zero transitions.
      - name: newly_registered_90d
        data_type: BIGINT
        description: >
          Count of trials first posted on the registry within the last 90
          days. A registration count, not a recruiting transition; computed
          from registry dates, so it needs no snapshot history.
      - name: has_multi_snapshot_history
        data_type: BOOLEAN
        description: Flag indicating whether multi-snapshot history has accrued for this profile.
      - name: observed_history_days
        data_type: BIGINT
        description: >
          Days of snapshot history observed as of this queue snapshot
          (earliest retained snapshot through the latest). Recruiting-growth
          figures are unknown below 90; this column quantifies "not enough
          history" instead of a bare null.
      - name: sponsor_count
        data_type: BIGINT
        description: Count of distinct lead sponsors in the segment.
      - name: distinct_sponsors
        data_type: BIGINT
        description: Standardized alias of sponsor_count.
      - name: top_sponsor_share
        data_type: DOUBLE
        description: Share of segment trials held by the leading sponsor.
      - name: sponsor_hhi
        data_type: DOUBLE
        description: Herfindahl-Hirschman Index of lead sponsor concentration, bounded in [0, 1].
      - name: competition_signal_band
        data_type: VARCHAR
        description: Descriptive competition signal tier derived from sponsor concentration.
      - name: site_overlap_share
        data_type: DOUBLE
        description: Share of recruiting trials in the segment that share at least one trial facility with another competing trial in the same indication profile, bounded in [0, 1].
      - name: site_overlap_rate
        data_type: DOUBLE
        description: Standardized alias of site_overlap_share (share of recruiting trials sharing facilities with another competing trial in the same indication profile).
      - name: record_quality_ok_share
        data_type: DOUBLE
        description: Share of trials in this segment meeting baseline record quality criteria.
      - name: data_confidence_share
        data_type: DOUBLE
        description: Operational data completeness share (retained pending Issue #78).
      - name: priority_explanation
        data_type: VARCHAR
        description: Plain-language summary of raw segment metrics for human review.
        tests: [not_null]
      - name: interpretation_note
        data_type: VARCHAR
        description: Mandatory guardrail notice that signals are public registry counts requiring human feasibility review.

  - name: mart_trial_similarity
    description: >
      Deterministic trial-pair comparability -- a structural/design
      signal, not clinical equivalence and not itself a competition
      signal. Grain: indication_profile_id x nct_id_a x nct_id_b; one
      row per pair within one profile's query scope, nct_id_a's top 25
      matches per profile only. A pair listed under two profiles is two
      rows, and a trial's top-25 can no longer be occupied by another
      indication's trials.
    contract:
      enforced: true
    columns:
      - name: trial_similarity_key
        data_type: VARCHAR
        description: >
          Surrogate key over indication_profile_id x nct_id_a x nct_id_b, so
          the same trial pair under two profiles is two rows with two keys.
        tests: [not_null, unique]
      - name: indication_profile_id
        data_type: VARCHAR
        description: Indication profile whose query scope produced this pair. Part of the model's grain, and the partition the top-25 cap is applied within.
        tests: [not_null]
      - name: nct_id_a
        data_type: VARCHAR
        tests: [not_null]
      - name: nct_id_b
        data_type: VARCHAR
        tests: [not_null]
      - name: similarity_score
        data_type: DOUBLE
        tests: [not_null]
      - name: similarity_rank
        data_type: BIGINT
        tests: [not_null]
      - name: same_condition
        data_type: INTEGER
        tests: [not_null]
      - name: weight_same_condition
        data_type: DOUBLE
        tests: [not_null]
      - name: weighted_same_condition
        data_type: DOUBLE
        tests: [not_null]
      - name: same_phase
        data_type: INTEGER
        tests: [not_null]
      - name: weight_same_phase
        data_type: DOUBLE
        tests: [not_null]
      - name: weighted_same_phase
        data_type: DOUBLE
        tests: [not_null]
      - name: geography_overlap
        data_type: INTEGER
        tests: [not_null]
      - name: weight_geography_overlap
        data_type: DOUBLE
        tests: [not_null]
      - name: weighted_geography_overlap
        data_type: DOUBLE
        tests: [not_null]
      - name: intervention_type_overlap
        data_type: INTEGER
        tests: [not_null]
      - name: weight_intervention_type_overlap
        data_type: DOUBLE
        tests: [not_null]
      - name: weighted_intervention_type_overlap
        data_type: DOUBLE
        tests: [not_null]
      - name: study_design_match
        data_type: INTEGER
        tests: [not_null]
      - name: weight_study_design_match
        data_type: DOUBLE
        tests: [not_null]
      - name: weighted_study_design_match
        data_type: DOUBLE
        tests: [not_null]
      - name: eligibility_compatible
        data_type: INTEGER
        tests: [not_null]
      - name: weight_eligibility_compatible
        data_type: DOUBLE
        tests: [not_null]
      - name: weighted_eligibility_compatible
        data_type: DOUBLE
        tests: [not_null]
      - name: enrollment_band_match
        data_type: INTEGER
        tests: [not_null]
      - name: weight_enrollment_band_match
        data_type: DOUBLE
        tests: [not_null]
      - name: weighted_enrollment_band_match
        data_type: DOUBLE
        tests: [not_null]
      - name: similarity_explanation
        data_type: VARCHAR

