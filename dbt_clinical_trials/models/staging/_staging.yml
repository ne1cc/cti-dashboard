version: 2

models:
  - name: stg_trial_snapshots
    description: One row per ingestion run (manifest summaries).
    columns:
      - name: ingestion_run_id
        tests: [not_null, unique]
      - name: status
        tests:
          - accepted_values:
              values: [running, success, partial, failed]
      - name: profile
        description: >
          Manifest field naming the profile that produced the run. Aliased to
          indication_profile_id in stg_trial_snapshots.sql so the rest of the
          project uses one vocabulary.
      - name: indication_profile_id
        description: Indication profile that produced this run; staging is where the column becomes mandatory.
        tests: [not_null]

  - name: stg_trials
    description: One row per profile + NCT ID + ingestion run, retaining raw record provenance.
    columns:
      - name: nct_id
        tests: [not_null]
      - name: ingestion_run_id
        tests: [not_null]
      - name: indication_profile_id
        description: Indication profile that produced this run (e.g. adrd, oncology_nsclc).
        tests: [not_null]
      - name: source_json_hash
        tests: [not_null]
      - name: overall_status
        tests:
          - accepted_values:
              values:
                [RECRUITING, ACTIVE_NOT_RECRUITING, NOT_YET_RECRUITING, COMPLETED,
                 ENROLLING_BY_INVITATION, SUSPENDED, TERMINATED, WITHDRAWN, UNKNOWN]
              config:
                severity: warn
      - name: healthy_volunteers
        description: Whether the trial accepts healthy volunteers (null if unknown/unstated).
      - name: minimum_age
        description: Verbatim ClinicalTrials.gov minimum age string.
      - name: minimum_age_raw
        description: Preserved verbatim registry minimum age string.
      - name: minimum_age_years
        description: Minimum eligibility age parsed into fractional years; null if missing/unbounded/malformed.
      - name: maximum_age
        description: Verbatim ClinicalTrials.gov maximum age string.
      - name: maximum_age_raw
        description: Preserved verbatim registry maximum age string.
      - name: maximum_age_years
        description: Maximum eligibility age parsed into fractional years; null if missing/unbounded/malformed.
      - name: sex
        description: Verbatim ClinicalTrials.gov sex eligibility (ALL, FEMALE, MALE, or null).
        tests:
          - accepted_values:
              values: [ALL, FEMALE, MALE]
              config:
                severity: warn
      - name: gender_based
        description: Whether eligibility is based on gender/sex criteria.
      - name: gender_description
        description: Registry explanation when gender_based is true.
      - name: std_age_groups
        description: List of standard age groups (CHILD, ADULT, OLDER_ADULT).
      - name: allocation
        description: Registry designInfo.allocation (RANDOMIZED, NON_RANDOMIZED, NA).
      - name: primary_purpose
        description: Registry designInfo.primaryPurpose (TREATMENT, PREVENTION, ...).
      - name: intervention_model
        description: Registry designInfo.interventionModel (PARALLEL, SINGLE_GROUP, ...).
      - name: masking
        description: >
          Registry designInfo.maskingInfo.masking level (NONE, SINGLE, DOUBLE,
          TRIPLE, QUADRUPLE); null when unstated.
      - name: has_placebo_arm
        description: True when any registry arm group declares type PLACEBO_COMPARATOR.
        tests: [not_null]
      - name: why_stopped
        description: Registry statusModule.whyStopped, stored verbatim; populated for terminated/withdrawn/suspended trials.
      - name: brief_summary
        description: Registry descriptionModule.briefSummary, stored verbatim (registry-provided text).
      - name: primary_outcome_time_frame
        description: timeFrame of the first registry primary outcome, verbatim (e.g. "78 weeks"); null when absent.

  - name: stg_trial_conditions
    columns:
      - name: nct_id
        tests: [not_null]
      - name: condition_group
        tests: [not_null]
      - name: mapping_confidence
        tests:
          - accepted_values:
              values: [high, medium, low]
      - name: indication_profile_id
        description: Indication profile that produced this run; staging is where the column becomes mandatory.
        tests: [not_null]

  - name: stg_trial_interventions
    columns:
      - name: indication_profile_id
        description: Indication profile that produced this run; staging is where the column becomes mandatory.
        tests: [not_null]

  - name: stg_trial_arms
    description: One row per profile + NCT ID + run + original zero-based arm group ordinal; registry text stored verbatim.
    columns:
      - name: nct_id
        tests: [not_null]
      - name: arm_ordinal
        description: Zero-based position of the arm group in the registry's armGroups list.
        tests: [not_null]
      - name: arm_type
        description: >
          Registry arm group type (EXPERIMENTAL, ACTIVE_COMPARATOR,
          PLACEBO_COMPARATOR, SHAM_COMPARATOR, NO_INTERVENTION, OTHER); null
          when the registry omits it (some observational arms).
        tests:
          - accepted_values:
              values: [EXPERIMENTAL, ACTIVE_COMPARATOR, PLACEBO_COMPARATOR, SHAM_COMPARATOR, NO_INTERVENTION, OTHER]
              config:
                severity: warn
      - name: intervention_names
        description: Registry interventionNames list for the arm, stored verbatim.
      - name: indication_profile_id
        description: Indication profile that produced this run; staging is where the column becomes mandatory.
        tests: [not_null]

  - name: stg_trial_sponsors
    columns:
      - name: nct_id
        tests: [not_null]
      - name: sponsor_role
        tests:
          - accepted_values:
              values: [lead_sponsor, collaborator]
      - name: indication_profile_id
        description: Indication profile that produced this run; staging is where the column becomes mandatory.
        tests: [not_null]

  - name: stg_trial_locations
    description: One row per profile + NCT ID + run + original recorded-location ordinal.
    columns:
      - name: nct_id
        tests: [not_null]
      - name: indication_profile_id
        description: Indication profile that produced this run; staging is where the column becomes mandatory.
        tests: [not_null]

  - name: stg_trial_outcomes
    columns:
      - name: nct_id
        tests: [not_null]
      - name: outcome_type
        tests:
          - accepted_values:
              values: [primary, secondary, other]
      - name: indication_profile_id
        description: Indication profile that produced this run; staging is where the column becomes mandatory.
        tests: [not_null]

  - name: stg_trial_contacts
    description: Deliberately empty (privacy guardrail) — contacts are never extracted.
