version: 2

models:
  - name: stg_trial_snapshots
    description: One row per ingestion run (manifest summaries).
    columns:
      - name: ingestion_run_id
        tests: [not_null, unique]
      - name: status
        tests:
          - accepted_values:
              values: [running, success, partial, failed]
      - name: profile
        description: >
          Manifest field naming the profile that produced the run. Aliased to
          indication_profile_id in stg_trial_snapshots.sql so the rest of the
          project uses one vocabulary.
      - name: indication_profile_id
        description: Indication profile that produced this run; staging is where the column becomes mandatory.
        tests: [not_null]

  - name: stg_trials
    description: One row per profile + NCT ID + ingestion run, retaining raw record provenance.
    columns:
      - name: nct_id
        tests: [not_null]
      - name: ingestion_run_id
        tests: [not_null]
      - name: indication_profile_id
        description: Indication profile that produced this run (e.g. adrd, oncology_nsclc).
        tests: [not_null]
      - name: source_json_hash
        tests: [not_null]
      - name: overall_status
        tests:
          - accepted_values:
              values:
                [RECRUITING, ACTIVE_NOT_RECRUITING, NOT_YET_RECRUITING, COMPLETED,
                 ENROLLING_BY_INVITATION, SUSPENDED, TERMINATED, WITHDRAWN, UNKNOWN]
              config:
                severity: warn

  - name: stg_trial_conditions
    columns:
      - name: nct_id
        tests: [not_null]
      - name: condition_group
        tests: [not_null]
      - name: mapping_confidence
        tests:
          - accepted_values:
              values: [high, medium, low]
      - name: indication_profile_id
        description: Indication profile that produced this run; staging is where the column becomes mandatory.
        tests: [not_null]

  - name: stg_trial_interventions
    columns:
      - name: indication_profile_id
        description: Indication profile that produced this run; staging is where the column becomes mandatory.
        tests: [not_null]

  - name: stg_trial_sponsors
    columns:
      - name: nct_id
        tests: [not_null]
      - name: sponsor_role
        tests:
          - accepted_values:
              values: [lead_sponsor, collaborator]
      - name: indication_profile_id
        description: Indication profile that produced this run; staging is where the column becomes mandatory.
        tests: [not_null]

  - name: stg_trial_locations
    description: One row per profile + NCT ID + run + original recorded-location ordinal.
    columns:
      - name: nct_id
        tests: [not_null]
      - name: indication_profile_id
        description: Indication profile that produced this run; staging is where the column becomes mandatory.
        tests: [not_null]

  - name: stg_trial_outcomes
    columns:
      - name: nct_id
        tests: [not_null]
      - name: outcome_type
        tests:
          - accepted_values:
              values: [primary, secondary, other]
      - name: indication_profile_id
        description: Indication profile that produced this run; staging is where the column becomes mandatory.
        tests: [not_null]

  - name: stg_trial_contacts
    description: Deliberately empty (privacy guardrail) — contacts are never extracted.
