version: 2

sources:
  - name: silver
    description: >
      Normalized Parquet entities produced by src/transform from immutable
      bronze API snapshots. One file per entity per ingestion run.
    meta:
      external_location: "read_parquet('data/silver/{name}/*.parquet', union_by_name=true)"
    tables:
      - name: silver_trials
        description: >
          One row per profile + NCT ID + ingestion run. snapshot_id is the run ID;
          retrieved_at_utc is nullable for historical pages. raw_page_reference
          is relative to the profile bronze root, with zero-based raw_study_ordinal
          and canonical source_json_hash identifying the original record.
      - name: silver_trial_conditions
        description: One row per NCT ID + raw condition + run, with taxonomy mapping.
      - name: silver_trial_interventions
        description: One row per NCT ID + intervention + run.
      - name: silver_trial_sponsors
        description: One row per NCT ID + sponsor/collaborator + run.
      - name: silver_trial_locations
        description: >
          One row per profile + NCT ID + run + original zero-based location_ordinal.
          Study provenance is retained on every recorded location row.
          Non-U.S. rows preserved and flagged unusable for U.S.-scope marts.
      - name: silver_trial_outcomes
        description: One row per NCT ID + outcome type + outcome index + run.

  - name: bronze
    description: >
      Ingestion-run manifests written by src/ingest, one directory per
      indication profile under data/bronze/<profile_id>/manifests.
    tables:
      - name: ingestion_manifests
        description: One row per ingestion run (Parquet summaries).
        meta:
          external_location: "read_parquet('data/bronze/*/manifests/summary_*.parquet', union_by_name=true)"
