name: clinical_trials
version: "0.1.0"
profile: clinical_trials

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets:
  - target
  - dbt_packages

# ingest_only_profiles must stay in sync with config/profiles/*.yml
# (tests/test_profiles.py::test_dbt_ingest_only_var_matches_registry) — dbt
# cannot import src.profiles, so the list is duplicated and guarded.
vars:
  ingest_only_profiles: ['full_catalog']
  # Candidate-pair guard for int_similarity_candidates: a condition-group
  # token whose per-profile trial count reaches this is dropped from pair
  # discovery, bounding the candidate join when one group dominates a large
  # profile. Tests/test_similarity_candidates.py exercises the drop with a
  # low override; docs/DEPLOY_FLY.md records the sizing story.
  similarity_max_token_df: 2000


models:
  clinical_trials:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  clinical_trials:
    +schema: seeds
    status_mapping:
      +column_types:
        is_active: boolean
        is_recruiting: boolean
    phase_mapping:
      +column_types:
        phase_order: integer
    state_population:
      +column_types:
        population: bigint
        fips_code: varchar
        state_code: varchar
