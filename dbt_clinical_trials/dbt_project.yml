name: clinical_trials
version: "0.1.0"
profile: clinical_trials

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets:
  - target
  - dbt_packages

# ingest_only_profiles must stay in sync with config/profiles/*.yml
# (tests/test_profiles.py::test_dbt_ingest_only_var_matches_registry) — dbt
# cannot import src.profiles, so the list is duplicated and guarded.
# Empty since issue #53: no shipped profile is bronze-only any more (the
# registry-wide full_catalog profile transforms via REGISTRY_TAXONOMY).
vars:
  min_sponsors_for_hhi: 3
  ingest_only_profiles: []
  # Candidate-pair guard for int_similarity_candidates: a condition-group
  # token whose per-profile trial count reaches this is dropped from pair
  # discovery, bounding the candidate join when one group dominates a large
  # profile. Tests/test_similarity_candidates.py exercises the drop with a
  # low override; docs/OPERATIONS.md records the sizing story.
  similarity_max_token_df: 2000


models:
  clinical_trials:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  clinical_trials:
    +schema: seeds
    status_mapping:
      +column_types:
        is_active: boolean
        is_recruiting: boolean
    phase_mapping:
      +column_types:
        phase_order: integer
    state_population:
      +column_types:
        population: bigint
        fips_code: varchar
        state_code: varchar
    acs_population:
      +column_types:
        geo_id: varchar
        state_fips: varchar
        population: bigint
        margin_of_error: bigint
    county_access_context:
      +column_types:
        county_fips: varchar
        state_fips: varchar
        latitude: double
        longitude: double
        svi_rpl_themes: double
        ruca_group_pop_share: double
    burden_places_county:
      +column_types:
        state_code: varchar
        county_fips: varchar
        adult_population: bigint
    burden_scp_lung_state:
      +column_types:
        state_fips: varchar
        annual_cases: bigint
    condition_burden_map:
      +column_types:
        denominator_available: boolean
    omb_race_ethnicity_mapping:
      +column_types:
        manually_reviewed: boolean
