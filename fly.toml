# fly.toml app configuration file generated for cti-dashboard on 2026-09-04T19:31:11-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cti-dashboard'
primary_region = 'iad'

# The entrypoint traps SIGTERM but defers it until the in-flight `make pipeline`
# returns (entrypoint.sh), so this has to cover a whole two-profile run, not its
# tail. Measured in this image on 2026-09-07 (linux/arm64, shared-cpu-1x, commit
# 78c2050, fresh named volume): 130s cold, 67s warm on a same-day re-run; two
# forced second real pulls measured 120s and 118s end to end. Rule: 2x the larger
# measurement, rounded up to 30s -> 270s, which is inside Fly's stated 300s
# maximum for kill_timeout (fly.io/docs/reference/configuration, 2026-09-07).
# The old 90s covered a 59s one-profile cold run and would have killed a
# two-profile refresh mid-write. An idle supervisor still exits within its next
# 5s tick.
kill_signal = 'SIGTERM'
kill_timeout = '270s'

# Production refreshes only the profiles the deployed envelope can hold.
# docs/DEPLOY_FLY.md ("Adding indication profiles") measured the twelve-profile
# set at 1.4 GB of bronze for the ten added profiles alone and 28 GB of DuckDB
# temporary storage for mart_trial_similarity without completing; the 2026-10-07
# outage was that set filling the volume, then entrypoint.sh dying on its first
# log append. adrd + oncology_nsclc is the measured-passing configuration
# (~130 s, 32 models, 137 tests). Re-expand only after the similarity mart is
# bounded and storage is sized from a completed local full build.
[env]
  CTI_REFRESHABLE_PROFILES = 'adrd,oncology_nsclc'

[build]
[[mounts]]
  source = 'cti_data'
  destination = '/app/data'

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = false
  # A machine that ends up stopped (crash-loop exhaustion, host migration,
  # manual stop) must wake on traffic instead of staying dark, which is how the
  # 2026-10-07 outage persisted for a week with no signal. auto_stop stays off:
  # the background refresh loop requires the machine always running.
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/_stcore/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
