# fly.toml app configuration file generated for cti-dashboard on 2026-09-04T19:31:11-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cti-dashboard'
primary_region = 'iad'

# The entrypoint traps SIGTERM but defers it until the current pipeline step
# returns, so Fly's default 3s grace would kill a refresh caught by a deploy
# mid-write. 90s covers the longest measured run (59s on a cold volume); an
# idle supervisor still exits within its next 5s tick.
kill_signal = 'SIGTERM'
kill_timeout = '90s'

[build]
[[mounts]]
  source = 'cti_data'
  destination = '/app/data'

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/_stcore/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
