<form action="/trials" method="get" class="search-form">
  <div><label for="cond">Condition or health topic</label><input id="cond" name="cond" value="{{ fields.get('cond', '') }}" autocomplete="off" list="condition-list"><datalist id="condition-list"></datalist></div>
  <div><label for="postal_code">U.S. ZIP code</label><input id="postal_code" name="postal_code" value="{{ fields.get('postal_code', '') }}" inputmode="numeric" pattern="[0-9]{5}" maxlength="5"></div>
  <div><label for="radius_mi">Distance in miles</label><input id="radius_mi" name="radius_mi" type="number" min="1" max="500" value="{{ fields.get('radius_mi', '') or '50' }}"></div>
  <div><label for="age">Age in years</label><input id="age" name="age" type="number" min="0" max="130" value="{{ fields.get('age', '') }}"></div>
  <div><label for="sex">Sex listed in trial criteria</label><select id="sex" name="sex"><option value="">Any</option>{% for value, label in [('ALL','All'),('FEMALE','Female'),('MALE','Male')] %}<option value="{{ value }}" {% if fields.get('sex') == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <div><label for="status">Trial status</label><select id="status" name="status"><option value="">Any</option>{% for value, label in [('RECRUITING','Recruiting'),('NOT_YET_RECRUITING','Not yet recruiting'),('ENROLLING_BY_INVITATION','Enrolling by invitation'),('ACTIVE_NOT_RECRUITING','Active, not recruiting'),('COMPLETED','Completed'),('SUSPENDED','Suspended'),('TERMINATED','Terminated'),('WITHDRAWN','Withdrawn')] %}<option value="{{ value }}" {% if fields.get('status') == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
  <p class="notice">Search details appear in the address bar and may be saved in your browser history or shared with the link.</p>
  <button type="submit">Search trials</button>
</form>
