name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Lint
        run: |
          uv run ruff check src tests dashboard
          uv run ruff format --check src tests dashboard

      - name: Type check
        run: uv run mypy

      - name: Unit tests with coverage gate
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=71

  deploy:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io with smoke check and rollback
        run: .github/scripts/deploy_fly.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
